<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : le contenu occupe tout l'écran des téléphones à encoche (marges gérées en CSS). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="PharmaStock — gestion de stock de médicaments" />
    <meta name="application-name" content="PharmaStock" />
    <!-- Installation sur l'écran d'accueil (iPhone / iPad) : plein écran, icône et nom dédiés. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PharmaStock" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>PharmaStock</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PharmaStock nécessite JavaScript.</noscript>
    <script src="/zod-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
