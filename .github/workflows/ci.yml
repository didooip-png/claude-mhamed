name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmastock
          POSTGRES_PASSWORD: pharmastock
          POSTGRES_DB: pharmastock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmastock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://pharmastock:pharmastock@localhost:5432/pharmastock_test?schema=public
      DATABASE_URL: postgresql://pharmastock:pharmastock@localhost:5432/pharmastock_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build du paquet partagé et génération du client Prisma
        run: |
          pnpm --filter @pharmastock/shared build
          pnpm --filter @pharmastock/api db:generate
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests unitaires et d'intégration
        run: pnpm test
      - name: Build
        run: |
          pnpm --filter @pharmastock/api build
          pnpm --filter @pharmastock/web build

  docker:
    # Les images de production se construisent et la pile complète démarre (HTTP, sans domaine).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de test
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "APP_PUBLIC_URL=http://localhost"
            echo "SITE_ADDRESS=:80"
            echo "COOKIE_SECURE=false"
          } > .env.production
      - name: Construction des images
        run: docker compose -f docker-compose.prod.yml --env-file .env.production build
      - name: Démarrage de la pile
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --wait --wait-timeout 180
      - name: Vérifications
        run: |
          curl -fsS http://localhost/api/v1/health
          curl -fsS http://localhost/ | grep -qi "<div id=\"root\""
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost/clients   # repli SPA
          docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api node dist/src/cli.js backup
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 200
      - name: Arrêt
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v
